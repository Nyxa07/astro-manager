@if (workspace.current(); as current) {
  <!-- Coquille provisoire : le shell (rail, bibliothèque, inspecteur) viendra ici. -->
  <main class="shell">
    <span class="label">Espace ouvert</span>
    <h1>{{ current.name }}</h1>
    <span class="mono">{{ current.root }}</span>
  </main>
} @else {
  <app-workspace-picker />
}
